<body class="body-home">
  <header class="site-header">
    <a class="logo" href="./">
      <img src="/img/logo.svg" alt="Logo del Frente Amplio" width="240px" height="32px">
    </a>
    <div/>
  </header>

  <main>
    <section class="hero">
      <div class="hero-text">
        <h1>Es la hora del Frente AMPLIO</h1>
        <!-- <p>Apoya al Frente AMPLIO para las elecciones generales del 29N</p> -->
      </div>
      <div class="hero-image" role="img" aria-label="Imagen principal"></div>
    </section>

    <section class="join" id="apuntate">
      <div class="join-inner">
        <p id="signup-count" class="join-count" hidden></p>
        <p class="join-claim">
          <strong>Apoya al Frente AMPLIO para las elecciones generales del 29N:</strong>
        </p>

        <form id="registration-form" class="join-form" action="#" method="post">
          <div class="join-row">
            <label>
              <span>Nombre</span>
              <input id="name" name="name" type="text" autocomplete="given-name" maxlength="100" required>
            </label>
            <label>
              <span>Apellidos</span>
              <input id="surname" name="surname" type="text" autocomplete="family-name" maxlength="100">
            </label>
          </div>
          <div class="join-row">
            <label>
              <span>Email</span>
              <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
            </label>
            <label>
              <span>Código postal</span>
              <input id="code" name="postal_code" type="text" autocomplete="postal-code" maxlength="30" pattern="\s*[A-Za-z0-9][A-Za-z0-9 \-]+\s*" title="Usa solo letras, números, espacios o guiones (mínimo 2 caracteres)." required>
            </label>
          </div>
          <div class="join-row join-row--hpot" aria-hidden="true">
            <label>
              <span>País</span>
              <input id="country" name="country" type="text" tabindex="-1" autocomplete="off">
            </label>
          </div>

          <div class="consent">
            <input id="consent" name="consent" type="checkbox" value="true" required>
            <label for="consent">He leído y acepto la <a href="./privacidad.html">política de privacidad</a></label>
          </div>

          <div id="turnstile"></div>

          <button id="submit-button" class="btn" type="submit">¡Apoyo!</button>

          <p id="form-message" class="form-message" role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>
  </main>
